; Firmware de teste do hardware da Central NFC de Filamentos.
; Placa: ESP32-2432S028R ("Cheap Yellow Display", CYD) + PN532 (I2C) + HX711.
;
; Dois ambientes:
;   cyd          -> tela com driver ILI9341 (a maioria das CYD)
;   cyd-st7789   -> use este se a tela ficar branca, embaralhada ou espelhada
;                   (algumas CYD com USB-C usam o ST7789)
; Se a tela funcionar mas as cores estiverem invertidas, use o botao "Cores" na
; propria tela; a escolha fica salva.

[platformio]
default_envs = cyd

[env]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
  bodmer/TFT_eSPI@2.5.43
  https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#v1.4
  adafruit/Adafruit PN532@1.3.4
  bogde/HX711@0.7.5
build_flags =
  -DUSER_SETUP_LOADED=1
  -DTFT_WIDTH=240
  -DTFT_HEIGHT=320
  -DTFT_MISO=12
  -DTFT_MOSI=13
  -DTFT_SCLK=14
  -DTFT_CS=15
  -DTFT_DC=2
  -DTFT_RST=-1
  -DTFT_BL=21
  -DTFT_BACKLIGHT_ON=HIGH
  -DUSE_HSPI_PORT=1
  -DSPI_FREQUENCY=55000000
  -DSPI_READ_FREQUENCY=20000000
  -DSPI_TOUCH_FREQUENCY=2500000
  -DLOAD_GLCD=1
  -DLOAD_FONT2=1
  -DLOAD_FONT4=1
  -DLOAD_FONT7=1
  ; --- ligacoes dos modulos (troque aqui se ligar diferente) ---
  -DPIN_NFC_SDA=27      ; CN1
  -DPIN_NFC_SCL=22      ; CN1
  -DPIN_HX_DT=35        ; P3 (so entrada, serve para DT)
  -DPIN_HX_SCK=1        ; P1 "TX". Alternativa: 4 (pad do LED vermelho, exige solda)

[env:cyd]
build_flags = ${env.build_flags} -DILI9341_2_DRIVER=1

[env:cyd-st7789]
build_flags = ${env.build_flags} -DST7789_DRIVER=1 -DTFT_RGB_ORDER=TFT_BGR
